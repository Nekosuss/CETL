<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CETL Tool - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">CETL <span>Cleansing · Extraction · Transformation</span></div>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('results') }}">Results</a>
      <a href="{{ url_for('database') }}">Database</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer>CETL Online Tool — academic demo project</footer>
</body>
</html>
